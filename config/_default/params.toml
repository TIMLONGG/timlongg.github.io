# PaperMod 主题参数
# 完整可选项：https://github.com/adityatelange/hugo-PaperMod/blob/master/docs/config.md

env         = "production"
description = "笔记 · 分享 · 记录"
keywords    = ["学习笔记", "机器学习", "系统设计", "LaTeX"]
mainSections = ["post"]

# 颜色模式：auto（跟随系统）/ light / dark
defaultTheme        = "light"
disableThemeToggle  = false

# 文章页元素
ShowReadingTime         = true
ShowWordCount           = false
ShowToc                 = true      # 长文自动生成目录
TocOpen                 = false
ShowCodeCopyButtons     = true
ShowPostNavLinks        = true      # 上一篇/下一篇
ShowBreadCrumbs         = false
ShowShareButtons        = false
ShowFullTextinRSS       = true
ShowRssButtonInSectionTermList = true
disableSpecial1stPost   = true      # 首页第一篇文章不做大字号特写，保持列表整齐
hideSummary             = false
comments                = false     # 需要评论时另配（例如 giscus）

# 首页顶部：标题 + 简介（搜索框也由这里的模板渲染，见 layouts/partials/home_info.html）
[homeInfoParams]
    Title   = "记录与思考"
    Content = "学习笔记、技术分享与日常记录。用分类整理主题，用标签串联线索。"

[assets]
    favicon = "/img/favicon.png"
# 站内搜索（Fuse.js，索引来自 /index.json）
[fuseOpts]
    iscasesensitive   = false
    shouldsort        = true
    location          = 0
    distance          = 1000
    threshold         = 0.4
    minmatchcharlength = 1
    limit             = 10
    keys              = ["title", "permalink", "summary", "content"]

[footer]
    # 默认会输出 © 年份 站点名 + Powered by Hugo & PaperMod，这里不再重复版权
    text = "笔记 · 分享 · 记录"

[[socialIcons]]
    name  = "github"
    title = "GitHub"
    url   = "https://github.com/TIMLONGG"

[[socialIcons]]
    name  = "rss"
    title = "RSS"
    url   = "/index.xml"
