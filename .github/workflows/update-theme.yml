name: Update theme

# 主题（PaperMod）以 git submodule 引用。
# 这个 workflow 只在手动触发时运行，把主题升到最新 master commit 并自动提交。
# 想定期自动更新，把下面的 schedule 注释放开即可。

on:
  # schedule:
  #   - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update theme submodule
        run: git submodule update --remote themes/hugo-PaperMod

      - name: Show new version
        run: git -C themes/hugo-PaperMod log --oneline -1

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update PaperMod theme"
