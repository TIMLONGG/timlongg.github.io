{{/*
    首页（= blog 列表页）顶部：站内搜索框
    - 个人信息已经放在左侧栏（见 layouts/_partials/header.html），这里不再重复
    - 搜索用 Fuse.js，索引是构建时生成的 /index.json，脚本在 extend_head.html 里按需加载
    - PaperMod 会把这个 partial 渲染在文章列表之前，所以搜索框天然位于 blog 页最上方
*/}}
{{- with site.Params.homeInfoParams }}
<h1 class="visually-hidden">{{ site.Title }} · Latest notes</h1>
{{- end }}

<div id="searchbox" class="searchbox home-search">
    <input id="searchInput" disabled placeholder="Search notes: title / keyword / body…" aria-label="Search" type="search"
        autocomplete="off" maxlength="64">
    <ul id="searchResults" class="searchResults" aria-label="Search results"></ul>
</div>
