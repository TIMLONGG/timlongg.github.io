# 站点主配置（主题：PaperMod，极简/学术风）
# 主题文档：https://github.com/adityatelange/hugo-PaperMod/wiki

baseURL = "https://timlongg.github.io/"
title   = "TIMLONGG"

# 界面语言：en（对应主题自带的 i18n/en.yaml，界面文案自动英文）
defaultContentLanguage = "en"
locale                 = "en-US"

# 笔记正文是中文，必须开启，否则摘要/字数统计会按空格分词
hasCJKLanguage = true
enableEmoji    = true
timeZone       = "Asia/Shanghai"

# 主题以 git submodule 引用，固定在 v8.0（见 .gitmodules）
theme = "hugo-PaperMod"

[pagination]
    pagerSize = 10

# 首页需要额外输出 JSON —— 这是站内搜索（Fuse.js）的数据源 /index.json
[outputs]
    home     = ["HTML", "RSS", "JSON"]
    section  = ["HTML", "RSS"]
    taxonomy = ["HTML", "RSS"]
    term     = ["HTML", "RSS"]
