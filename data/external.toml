# 覆盖主题默认的 CDN 资源：改成本地自托管
#
# 主题默认从 cdn.jsdelivr.net 加载 KaTeX（公式）和 PhotoSwipe（图片点击放大）。
# jsdelivr 在国内网络时常不可用，公式就无法渲染，所以这里换成本仓库内的静态文件。
#
# 想改回 CDN：删掉本文件即可（主题自带一份 CDN 配置）。
# 升级 KaTeX / PhotoSwipe：下载新版本覆盖 static/vendor/ 下的文件即可，注意 KaTeX 的
# katex.min.css 里引用了 fonts/ 目录，字体文件要一起更新。
#
# 注意：Mermaid（流程图）仍是主题内置的 jsdelivr 地址，只有文章里出现 mermaid 代码块时才会加载。

KaTeX = [
    { src = "/vendor/katex/katex.min.css", type = "style" },
    { src = "/vendor/katex/katex.min.js", type = "script", defer = true },
    { src = "/vendor/katex/auto-render.min.js", type = "script", defer = true },
]

[PhotoSwipe]
    Style    = "/vendor/photoswipe/photoswipe.css"
    Core     = "/vendor/photoswipe/photoswipe.esm.min.js"
    Lightbox = "/vendor/photoswipe/photoswipe-lightbox.esm.min.js"
