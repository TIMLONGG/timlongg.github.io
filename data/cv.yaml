  # - title: Selected Projects
  #   items:
  #     - title: Mathematical Reasoning Alignment for LLMs with SFT / EI (Self-Taught Reasoner) / GRPO
  #       date: Sep 2025 – Nov 2025
  #       details:
  #         - Built an end-to-end post-training pipeline for Qwen2.5-Math-1.5B using curated chain-of-thought traces generated by GPT-OSS-120B on MATH 12K; compared supervised fine-tuning, expert iteration, and reinforcement-learning alignment under a unified GSM8K evaluation.
  #         - Designed a decoupled two-GPU architecture (2 × A800 80 GB) for concurrent policy training and vLLM rollout/evaluation, with hot weight synchronization and verifiable answer-and-format rewards for stable training.
  #         - Implemented the GRPO training stack, including reward computation, group-normalized advantages, old log-probability caching, importance ratios, clipped loss, gradient accumulation, and key hyperparameter/strategy ablations.
  #         - Improved GSM8K performance from a 17.59% accuracy / 50.42% format-compliance baseline to 79.99% accuracy / 99.1%+ format compliance with GRPO, outperforming SFT (76.20%) and EI (71.80%) under the same training budget.
  #     - title: Step-RL — Reinforcement Learning for Mobile Intelligent Assistants
  #       date: Jan 2026 – Mar 2026
  #       details:
  #         - Designed and implemented a Step-RL framework for long-horizon mobile tasks, such as end-to-end e-commerce automation, to improve multi-step task completion and instruction following.
  #         - Fine-tuned a Qwen3-8B baseline with LoRA and developed a Progress Estimator (LLM + lightweight MLP) that converts sparse terminal rewards into dense intermediate feedback, accelerating PPO convergence.
  #         - Introduced grounding signals that monitor clickability, element existence, and page-loading state; incorporated environment feedback into reward penalties to reduce invalid actions and improve decision stability.
  #         - Increased e-commerce task completion from 85% to 90%, reduced average multi-turn task time by 28% (25 s to 18 s), and achieved 96.2% action-grounding accuracy.

