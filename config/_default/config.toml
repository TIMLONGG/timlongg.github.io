# 站点主配置
# 文档：https://stack.cai.im/zh/  |  https://gohugo.io/configuration/all/

baseurl = "https://timlongg.github.io/"
title   = "TIMLONGG"
locale  = "zh-CN"

# 主题自带 i18n/zh.toml，界面文案会自动变成中文
defaultContentLanguage = "zh"

# 中文内容一定要开启，否则 .Summary / .WordCount 会按空格分词导致统计错误
hasCJKLanguage = true

enableEmoji = true

# 首页卡片摘要长度（按字符数）
summaryLength = 80

# 时间区域：写 front matter 时带 +0800 也可以
timeZone = "Asia/Shanghai"

[author]
    name = "TIMLONGG"

[pagination]
    pagerSize = 10

# 让文章的 markdown 文件里可以直接写 [ref]({{< ref "/post/xxx" >}}) 之类
[markup.goldmark.renderer]
    unsafe = true
