# PaperMod 主题参数
# 完整可选项：https://github.com/adityatelange/hugo-PaperMod/blob/master/docs/config.md

env         = "production"
description = "Notes · Writing · Sharing"
keywords    = ["study notes", "machine learning", "ML systems", "distributed training", "LaTeX"]
mainSections = ["post"]

# 左侧个人信息栏里的简介（支持 Markdown）
profileBio = "Study notes and technical write-ups on machine learning systems, distributed training, and tooling."

# 颜色模式：auto（跟随系统）/ light / dark
defaultTheme        = "light"
disableThemeToggle  = false

# 文章页元素
ShowReadingTime         = true
ShowWordCount           = false
ShowToc                 = true      # 长文自动生成目录
TocOpen                 = false
ShowCodeCopyButtons     = true
ShowPostNavLinks        = true      # 上一篇/下一篇
ShowBreadCrumbs         = false
ShowShareButtons        = false
ShowFullTextinRSS       = true
ShowRssButtonInSectionTermList = true
disableSpecial1stPost   = true      # 首页第一篇文章不做大字号特写，保持列表整齐
hideSummary             = false
comments                = false     # 需要评论时另配（例如 giscus）

# 首页顶部：简介 + 搜索框的触发开关
# 说明：这个字段现在只作为“渲染 home_info 部分”的开关（个人简介已放在左侧栏的 profileBio 里），
# 具体渲染什么由 layouts/_partials/home_info.html 控制
[homeInfoParams]
    Title   = "MLSys·im Experiment Notes"
    Content = ""

[assets]
    favicon          = "/img/favicon.png"
    favicon16x16     = "/img/favicon-16x16.png"
    favicon32x32     = "/img/favicon-32x32.png"
    apple_touch_icon = "/img/apple-touch-icon.png"
    safari_pinned_tab = "/img/safari-pinned-tab.svg"
# 站内搜索（Fuse.js，索引来自 /index.json）
[fuseOpts]
    iscasesensitive   = false
    shouldsort        = true
    location          = 0
    distance          = 1000
    threshold         = 0.4
    minmatchcharlength = 1
    limit             = 10
    keys              = ["title", "permalink", "summary", "content", "tags", "categories"]

[[socialIcons]]
    name  = "github"
    title = "GitHub"
    url   = "https://github.com/TIMLONGG"

[[socialIcons]]
    name  = "rss"
    title = "RSS"
    url   = "/index.xml"
